name: CodeQL

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: '27 3 * * 1'   # weekly, Monday ~03:27 UTC

jobs:
  analyze:
    name: Analyze (java)
    runs-on: ubuntu-latest
    permissions:
      security-events: write   # upload results to the Code scanning tab
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      # Manual build mode: CodeQL traces our own Gradle compile to build the
      # database. Uses the same JDK 26 toolchain as ci.yml. If the Java extractor
      # can't yet handle 26 bytecode, this build step is where it will surface.
      - name: Set up JDK 26
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '26'
          cache: gradle

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
          build-mode: manual

      - name: Compile
        run: ./gradlew --no-daemon clean compileJava

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:java"
