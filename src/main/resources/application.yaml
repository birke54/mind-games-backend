spring:
  threads:
    virtual: true
  application:
    name: mind-games-backend
  # Auth is entirely JWT-based (see JwtAuthenticationFilter); no UserDetailsService bean exists, so
  # Spring Security would otherwise fall back to a generated in-memory `user` and log a "generated
  # security password ... for development use only" warning on every startup. That user is never
  # used, so drop the auto-config that creates it.
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  # Cap each graceful-shutdown phase so the app finishes draining within ECS's 30s SIGKILL grace.
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    # TODO: replace with the real connection string (or set the DB_URL env var).
    # Format: jdbc:mysql://<host>:<port>/<database>?<params>
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      pool-name: mind-games-pool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000 # 30s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: false
  # Outbound mail. Production points at SES's SMTP endpoint
  # (email-smtp.us-west-2.amazonaws.com:587, STARTTLS); CI points at a Mailpit container, which
  # wants neither auth nor TLS — hence both being switchable rather than hard-coded. Unused unless
  # app.password-reset.mailer is `smtp`.
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    # SES SMTP authenticates with credentials, not the task's IAM role, so these come from Secrets
    # Manager. They are NOT the IAM access key/secret — SES derives a separate SMTP password.
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
            required: ${MAIL_SMTP_STARTTLS:true}
          # Don't let a wedged mail host hold an HTTP thread (or a DB transaction) open forever.
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Trust X-Forwarded-* headers from the upstream API gateway / TLS-terminating proxy so
# scheme, isSecure(), and redirect URLs reflect the original HTTPS request. Only safe when a
# trusted proxy overwrites these headers on the way in.
server:
  forward-headers-strategy: framework
  # Let in-flight requests finish when ECS sends SIGTERM (deploys/scale-in) before the JVM exits.
  shutdown: graceful

# Actuator listens on its own port, not the application port, so the operational surface can be
# reached without also reaching the API. That separation is what lets a metrics scraper be handed
# port 9090 alone; if the endpoints sat on 8080, anything allowed in to scrape would also be able
# to call every /api route directly, around CloudFront, WAF, and OriginVerificationFilter. It also
# means a future API Gateway catch-all route cannot re-expose actuator by accident.
#
# Spring Security's chain does apply to this port, but health and prometheus are both permitAll
# (a scraper has no token and cannot obtain one), so anything that can reach 9090 can read the
# metrics. The security group is the real boundary — never attach this port to an internet-facing
# load balancer.
#
# Kubernetes-style liveness/readiness probes are enabled so orchestrators/load balancers can
# distinguish "process up" from "ready for traffic". The ALB health-checks /actuator/health/readiness
# on this port, not the aggregate /actuator/health: the aggregate folds in the mail indicator, so an
# unreachable SES would mark every task unhealthy and ECS would kill a service that can still deal
# boards and authenticate.
#
# Readiness defaults to readinessState alone, which only reports that the app finished starting — it
# would stay UP with the database gone. Adding db keeps the check honest: no database means no
# request this service handles can succeed, so it should leave the load balancer rotation.
management:
  server:
    port: ${MANAGEMENT_PORT:9090}
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

app:
  jwt:
    # HMAC-SHA256 signing key: Base64-encoded, at least 32 bytes (256 bits).
    # Generate one with:  openssl rand -base64 32
    # No default on purpose — the app must be given a real secret via JWT_SECRET.
    secret: ${JWT_SECRET}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES}
    # Refresh token (persistent login) lifetime. Sliding: rotated on every /refresh.
    refresh-expiration-days: ${JWT_REFRESH_EXPIRATION_DAYS}
    # Cron for purging expired refresh-token rows (Spring 6-field cron). Default: daily 03:00.
    refresh-cleanup-cron: ${JWT_REFRESH_CLEANUP_CRON:0 0 3 * * *}
  password-reset:
    # A reset link is a live account-takeover secret sitting in an inbox. Short by design.
    token-expiration-minutes: ${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:30}
    # Per-user cap. Without one, the endpoint is an anonymous email cannon aimed at any address
    # someone cares to type. Requests past the cap are dropped silently (still a 202) — saying
    # "rate limited" would leak that the address has an account.
    max-requests-per-hour: ${PASSWORD_RESET_MAX_REQUESTS_PER_HOUR:3}
    # Front-end route the emailed link points at; the raw token is appended as ?token=...
    reset-url: ${PASSWORD_RESET_URL:https://cortexclash.org/reset-password}
    # How the link is delivered: `smtp` to send it, `log` to write it to the log instead.
    # `log` is the local-development default and MUST NOT be used in a deployed environment — the
    # log line contains a live account-takeover secret. Deployments set this to `smtp`.
    mailer: ${PASSWORD_RESET_MAILER:log}
    # A verified SES *domain* identity authorises every address at that domain, so noreply@ is
    # sendable with no mailbox behind it. Bounces do not need one either: with no custom MAIL FROM
    # the envelope sender is amazonses.com, so bounces return to SES.
    from: ${PASSWORD_RESET_FROM:Cortex Clash <noreply@cortexclash.org>}
    # Replies, however, do need somewhere to land — people answer reset mail with "I didn't request
    # this". Forwarded to a human via Namecheap (Domain → Redirect Email).
    reply-to: ${PASSWORD_RESET_REPLY_TO:support@cortexclash.org}
    # Cron for purging expired reset-token rows (Spring 6-field cron). Default: daily 03:30.
    cleanup-cron: ${PASSWORD_RESET_CLEANUP_CRON:0 30 3 * * *}
  multiplayer:
    # How long a lobby may advertise its join code before it is abandoned. A match has no other way
    # to end than someone finishing, so without this an unjoined lobby lives forever and keeps its
    # code reserved.
    lobby-timeout-minutes: ${MATCH_LOBBY_TIMEOUT_MINUTES:15}
    # How long a started race may run before it is presumed abandoned. Generous on purpose: a hard
    # puzzle left overnight and picked up in the morning is normal play, not a dead match.
    idle-timeout-minutes: ${MATCH_IDLE_TIMEOUT_MINUTES:1440}
    # Cron for the stale-match sweep (Spring 6-field cron). Default: every five minutes, which is
    # frequent enough that a lobby's stated timeout is roughly what a player experiences.
    cleanup-cron: ${MATCH_CLEANUP_CRON:0 */5 * * * *}
  security:
    # Secure flag on the refresh cookie. Set to false for local development over plain HTTP,
    # otherwise the browser will not send the cookie back.
    cookie-secure: ${COOKIE_SECURE:true}
    lockout-threshold: ${SECURITY_LOCKOUT_THRESHOLD}
    # Shared secret CloudFront injects as X-Origin-Verify, proving the request came through the
    # distribution (and therefore through WAF) rather than straight at the execute-api URL.
    # Blank disables the check — the default, so local runs and a pre-CloudFront deploy still work.
    # Generate with:  openssl rand -base64 32
    origin-verify-secret: ${ORIGIN_VERIFY_SECRET:}
  board_grading:
    min_threshold: ${BOARD_GRADING_MIN_THRESHOLD}
    easy_threshold: ${BOARD_GRADING_EASY_MAX_THRESHOLD}
    moderate_threshold: ${BOARD_GRADING_MODERATE_MAX_THRESHOLD}
    hard_threshold: ${BOARD_GRADING_HARD_MAX_THRESHOLD}
  board_generation:
    # Target pool size per difficulty; a refill tops the difficulty back up to this count.
    pregeneration-board-count: ${BOARD_GENERATION_PREGENERATION_BOARD_COUNT}
    # Refill is only triggered once a difficulty's available count drops below this.
    low-watermark: ${BOARD_GENERATION_LOW_WATERMARK}
    # How many times to retry generation for a single board before giving up on it.
    max-attempts-per-board: ${BOARD_GENERATION_MAX_ATTEMPTS_PER_BOARD}
    # Spring 6-field cron for the pool-monitor / refill check. Default: every 5 minutes.
    refill-cron: ${BOARD_GENERATION_REFILL_CRON:0 */5 * * * *}
