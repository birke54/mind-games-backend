# Test-only values for the env-var-backed placeholders in application.yaml, so the full
# application context can start during MindGamesApplicationTests.contextLoads(). The datasource
# entries are only here to satisfy placeholder resolution — the actual connection is supplied at
# runtime by the Testcontainers MySQL container via @ServiceConnection (see
# TestcontainersConfiguration).
DB_URL=jdbc:mysql://localhost:3306/placeholder
DB_USERNAME=placeholder
DB_PASSWORD=placeholder

# HMAC-SHA256 key, Base64-encoded 32 bytes ("0123456789abcdef0123456789abcdef").
JWT_SECRET=MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
JWT_EXPIRATION_MINUTES=60
JWT_REFRESH_EXPIRATION_DAYS=30

SECURITY_LOCKOUT_THRESHOLD=5

BOARD_GRADING_MIN_THRESHOLD=1
BOARD_GRADING_EASY_MAX_THRESHOLD=50
BOARD_GRADING_MODERATE_MAX_THRESHOLD=150
BOARD_GRADING_HARD_MAX_THRESHOLD=300

BOARD_GENERATION_PREGENERATION_BOARD_COUNT=20
BOARD_GENERATION_LOW_WATERMARK=5
BOARD_GENERATION_MAX_ATTEMPTS_PER_BOARD=100
