plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.cortex-clash'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(26)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	// Adds /actuator/prometheus (OpenMetrics text) alongside the JSON /actuator/metrics, so a
	// scraping time-series DB can read the MetricsService counters. Runtime-only: the export
	// auto-configuration already ships in the actuator starter and switches on when this registry
	// appears on the classpath, so nothing compiles against it.
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.security:spring-security-crypto'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	// Password reset mail. SMTP rather than the SES SDK on purpose: the raw reset token is never
	// persisted, so the email is the only place it exists — speaking SMTP means CI can point at a
	// Mailpit container, read the link back out, and test the happy path end to end. See
	// mind-games-ui docs/password-reset.md §2 (the design lives with the Playwright spec that
	// relies on it).
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'io.jsonwebtoken:jjwt-api:0.13.0'
	runtimeOnly   'io.jsonwebtoken:jjwt-impl:0.13.0'
	runtimeOnly   'io.jsonwebtoken:jjwt-jackson:0.13.0'
	// Boot 4 ships each technology's auto-configuration in its own module: without
	// spring-boot-flyway, flyway-core is on the classpath but nothing runs it, so migrations are
	// silently skipped and `ddl-auto: validate` then fails against an empty schema.
	implementation 'org.springframework.boot:spring-boot-flyway'
	implementation 'org.flywaydb:flyway-core'
	implementation 'org.flywaydb:flyway-mysql'
	runtimeOnly 'com.mysql:mysql-connector-j'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	// Same Boot 4 split as spring-boot-flyway above, applied to the test slices: @DataJpaTest and
	// TestEntityManager are no longer in spring-boot-test-autoconfigure and ship in their own
	// modules.
	testImplementation 'org.springframework.boot:spring-boot-data-jpa-test'
	// Spin a throwaway MySQL for the full-context smoke test, so Flyway runs the real MySQL
	// migrations and Hibernate validates against them — an embedded DB can't do either faithfully.
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-mysql'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}
